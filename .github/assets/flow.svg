<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#16214a"/><stop offset=".6" stop-color="#0b1130"/><stop offset="1" stop-color="#060919"/></radialGradient>
    <radialGradient id="orb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".25" stop-color="#b9c8ff"/><stop offset=".7" stop-color="#4f6be0"/><stop offset="1" stop-color="#1b2a78"/></radialGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#6f8df5" stop-opacity=".55"/><stop offset="1" stop-color="#6f8df5" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="0" x2="1"><stop offset="0" stop-color="#8aa4ff"/><stop offset=".5" stop-color="#35c486"/><stop offset="1" stop-color="#8aa4ff"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26356f" stop-opacity=".95"/><stop offset="1" stop-color="#121a45" stop-opacity=".95"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fb4ff"/><stop offset="1" stop-color="#3a4fb0" stop-opacity=".3"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#7d97ff" opacity=".18"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity=".5"/></filter>
    <path id="orbit" d="M600 110 A430 170 0 1 1 599.9 110 Z"/>
    <style>
      .t{font-size:12px;letter-spacing:3px;fill:#8aa4ff;font-weight:700}
      .h{font-size:20px;font-weight:700;fill:#fff}
      .s{font-size:13px;fill:#9aa8d6}
      .node{animation:float 6s ease-in-out infinite}
      .n2{animation-delay:1.5s}.n3{animation-delay:3s}.n4{animation-delay:4.5s}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      .spin{animation:spin 24s linear infinite;transform-origin:600px 280px}
      .spinr{animation:spin 16s linear infinite reverse;transform-origin:600px 280px}
      @keyframes spin{to{transform:rotate(360deg)}}
      .debt{stroke-dasharray:440;animation:pay 9s ease-in-out infinite}
      @keyframes pay{0%{stroke-dashoffset:40}80%{stroke-dashoffset:360}100%{stroke-dashoffset:40}}
      .pulse{animation:pulse 3s ease-in-out infinite;transform-origin:600px 280px}
      @keyframes pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.18);opacity:1}}
      .tw{animation:tw 2.4s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
      .pct{animation:pct 9s steps(1) infinite}
    </style>
  </defs>

  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#dots)"/>
  <text x="60" y="58" class="t">HOW IT WORKS</text>
  <text x="60" y="84" class="s">one loop, running every minute</text>

  <!-- orbit track -->
  <use href="#orbit" fill="none" stroke="#2a3a80" stroke-width="2"/>
  <use href="#orbit" fill="none" stroke="url(#ring)" stroke-width="3" stroke-dasharray="4 14" opacity=".8" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="3s" repeatCount="indefinite"/>
  </use>

  <!-- particles riding the loop -->
  <g filter="url(#glow)">
    <circle r="7" fill="#8aa4ff"><animateMotion dur="8s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle>
    <circle r="5" fill="#35c486"><animateMotion dur="8s" begin="-2s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle>
    <circle r="7" fill="#8aa4ff"><animateMotion dur="8s" begin="-4s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle>
    <circle r="5" fill="#35c486"><animateMotion dur="8s" begin="-6s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle>
  </g>

  <!-- core: the vault and its debt ring -->
  <circle cx="600" cy="280" r="150" fill="url(#halo)" class="pulse"/>
  <g class="spin"><circle cx="600" cy="280" r="112" fill="none" stroke="#6f8df5" stroke-width="1.5" stroke-dasharray="2 10" opacity=".7"/></g>
  <g class="spinr"><circle cx="600" cy="280" r="124" fill="none" stroke="#35c486" stroke-width="1" stroke-dasharray="30 40" opacity=".5"/></g>
  <circle cx="600" cy="280" r="70" fill="none" stroke="#1d2757" stroke-width="12"/>
  <circle class="debt" cx="600" cy="280" r="70" fill="none" stroke="#e8623f" stroke-width="12" stroke-linecap="round" transform="rotate(-90 600 280)" filter="url(#glow)"/>
  <circle cx="600" cy="280" r="54" fill="url(#orb)" filter="url(#sh)"/>
  <text x="600" y="276" text-anchor="middle" font-size="11" letter-spacing="2" font-weight="700" fill="#0b1130">YOUR DEBT</text>
  <text x="600" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#0b1130">going down</text>

  <!-- nodes: deposit (top) → borrow (right) → earn (bottom) → repay (left) -->
  <g class="node" filter="url(#sh)">
    <rect x="490" y="70" width="220" height="80" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
    <circle cx="526" cy="110" r="18" fill="#6f8df5"/><text x="526" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
    <text x="554" y="102" class="t">DEPOSIT</text><text x="554" y="128" class="h">Stock token</text>
  </g>
  <g class="node n2" filter="url(#sh)">
    <rect x="920" y="240" width="230" height="80" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
    <circle cx="956" cy="280" r="18" fill="#6f8df5"/><text x="956" y="286" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
    <text x="984" y="272" class="t">BORROW</text><text x="984" y="298" class="h">USDG loan</text>
  </g>
  <g class="node n3" filter="url(#sh)">
    <rect x="480" y="410" width="240" height="80" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
    <circle cx="516" cy="450" r="18" fill="#35c486"/><text x="516" y="456" text-anchor="middle" font-size="16" font-weight="700" fill="#0b1130">3</text>
    <text x="544" y="442" class="t">EARN</text><text x="544" y="468" class="h">Pool fees</text>
    <g fill="#35c486"><rect x="660" y="446" width="6" height="18" rx="2" class="tw"/><rect x="670" y="438" width="6" height="26" rx="2" class="tw" style="animation-delay:.4s"/><rect x="680" y="444" width="6" height="20" rx="2" class="tw" style="animation-delay:.8s"/><rect x="690" y="434" width="6" height="30" rx="2" class="tw" style="animation-delay:1.2s"/></g>
  </g>
  <g class="node n4" filter="url(#sh)">
    <rect x="50" y="240" width="230" height="80" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
    <circle cx="86" cy="280" r="18" fill="#e8623f"/><text x="86" y="286" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
    <text x="114" y="272" class="t">REPAY</text><text x="114" y="298" class="h">Fees hit debt</text>
  </g>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="160" cy="130" r="1.6" class="tw"/><circle cx="1040" cy="110" r="1.8" class="tw" style="animation-delay:.8s"/>
    <circle cx="1100" cy="460" r="1.4" class="tw" style="animation-delay:1.6s"/><circle cx="220" cy="470" r="1.6" class="tw" style="animation-delay:1.1s"/>
    <circle cx="880" cy="170" r="1.2" class="tw" style="animation-delay:.3s"/><circle cx="330" cy="400" r="1.2" class="tw" style="animation-delay:2s"/>
  </g>

  <circle cx="72" cy="526" r="5" fill="#35c486" class="tw"/>
  <text x="86" y="531" class="s">auto-repay checks every vault once a minute · only the owner can withdraw</text>
</svg>
