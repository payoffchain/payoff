<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PAYOFF token notice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Archivo:wght@400;500&family=IBM+Plex+Mono:wght@400;500;600&family=Pixelify+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ice:#7d97ff;--ice2:#b9c7ff;--navy:#020818;--mute:#8d9ac4;--faint:#5d6a96;--red:#ff8466;--mono:'IBM Plex Mono',monospace;--disp:'Bricolage Grotesque',sans-serif;--body:'Archivo',sans-serif}
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:675px;overflow:hidden;background:var(--navy)}
  body{position:relative;font-family:var(--body);color:#fff;
    background:
      radial-gradient(38% 55% at 78% 42%,rgba(91,120,242,.55),transparent 70%),
      radial-gradient(30% 40% at 96% 96%,rgba(125,151,255,.28),transparent 70%),
      radial-gradient(45% 50% at 0% 0%,rgba(40,60,150,.45),transparent 70%),
      repeating-linear-gradient(0deg,rgba(125,151,255,.05) 0 1px,transparent 1px 48px),
      repeating-linear-gradient(90deg,rgba(125,151,255,.05) 0 1px,transparent 1px 48px),
      linear-gradient(160deg,#030b22,#020818 60%,#040d2a)}
  /* rings behind the mark */
  .ring{position:absolute;border-radius:50%;border:1px solid rgba(125,151,255,.22)}
  .r1{width:520px;height:520px;left:660px;top:22px}
  .r2{width:700px;height:700px;left:570px;top:-68px;border-color:rgba(125,151,255,.12)}
  .r3{width:900px;height:900px;left:470px;top:-168px;border-color:rgba(125,151,255,.07)}
  .mark{position:absolute;left:806px;top:118px;width:300px;height:300px;border-radius:72px;transform:rotate(8deg);
    box-shadow:0 0 0 1px rgba(255,255,255,.35),0 40px 90px -20px rgba(91,120,242,.9),0 0 140px 10px rgba(91,120,242,.45)}
  .top{position:absolute;left:64px;right:64px;top:44px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.26em;color:var(--mute)}
  .top b{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:.04em;color:#fff}
  .live{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border:1px solid rgba(125,151,255,.45);border-radius:999px;background:rgba(125,151,255,.1);color:var(--ice2)}
  .live i{width:8px;height:8px;border-radius:50%;background:#7dffb0;box-shadow:0 0 12px #7dffb0}
  h1{position:absolute;left:58px;top:128px;font-family:var(--disp);font-weight:800;font-size:150px;line-height:.92;letter-spacing:-.045em;
    background:linear-gradient(100deg,#ffffff 10%,#c9d4ff 45%,#7d97ff 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
  h2{position:absolute;left:66px;top:286px;font-family:var(--disp);font-weight:800;font-size:76px;letter-spacing:-.03em;color:var(--ice)}
  .lede{position:absolute;left:68px;top:396px;font-size:21px;line-height:1.45;color:var(--mute);width:560px}
  .lede b{color:#fff;font-weight:500}
  .bar{position:absolute;left:64px;right:64px;bottom:64px;padding:20px 26px 22px;border-radius:20px;border:1px solid rgba(125,151,255,.35);
    background:linear-gradient(180deg,rgba(125,151,255,.16),rgba(125,151,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 30px 60px -30px rgba(0,0,0,.9)}
  .bar .lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--mute);margin-bottom:10px}
  .ca{font-family:var(--mono);font-weight:600;font-size:35px;letter-spacing:.005em;color:#fff;white-space:nowrap}
  .ca i{font-style:normal;color:var(--ice)}
  .foot{position:absolute;left:64px;right:64px;bottom:26px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--faint)}
  .foot .warn{color:var(--red)}
</style>
</head>
<body>
  <div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div>
  <img class="mark" src="../public/mark.png" alt="">
  <div class="top"><span><b>PAYOFF</b>&nbsp;&nbsp;·&nbsp;&nbsp;SELF-REPAYING LOANS</span><span class="live"><i></i><span id="stamp">CA LIVE</span></span></div>
  <h1 id="tick">$PAYOFF</h1>
  <h2 id="h2">is live.</h2>
  <p class="lede" id="lede">on <b>Robinhood Chain</b>. one contract address.<br>this one, and only this one.</p>
  <div class="bar">
    <div class="lbl"><span>CONTRACT ADDRESS</span><span id="via"></span></div>
    <div class="ca" id="ca">0x0000000000000000000000000000000000000000</div>
  </div>
  <div class="foot"><span>SAME ADDRESS AT THE BOTTOM OF PAYOFFCHAIN.TECH</span><span class="warn">ANYTHING ELSE UNDER OUR NAME IS FAKE</span></div>
  <script>
    // ?ca=0x…&ticker=$PAYOFF&via=pons  (+ h2 / lede / stamp overrides)
    const q = new URLSearchParams(location.search);
    if (q.get("ticker")) {
      const t = document.getElementById("tick"); t.textContent = q.get("ticker");
      // long tickers shrink to fit the left column
      const n = q.get("ticker").length; if (n > 7) t.style.fontSize = Math.max(96, Math.round(150 * 7 / n)) + "px";
    }
    const ca = q.get("ca");
    if (ca) document.getElementById("ca").innerHTML = "<i>" + ca.slice(0, 6) + "</i>" + ca.slice(6, -4) + "<i>" + ca.slice(-4) + "</i>";
    if (q.get("via")) document.getElementById("via").textContent = "LAUNCHED VIA " + q.get("via").toUpperCase();
    for (const k of ["h2", "lede", "stamp"]) if (q.get(k)) document.getElementById(k).innerHTML = q.get(k);
  </script>
</body>
</html>
